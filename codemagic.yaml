workflows:
  android-workflow:
    name: AetherOS Android Build
    max_build_duration: 30
    environment:
      node: v20
      java: 17
    scripts:
      - name: Extract and Build Web
        script: |
          unzip -q app-store-mirror-main.zip
          # Klasör adıyla uğraşmamak için içindeki ilk dizine otomatik gir
          cd $(ls -d */ | head -n 1)
          npm install
          npm run build
      - name: Clean Setup and Build APK
        script: |
          cd $(ls -d */ | head -n 1)
          rm -rf android capacitor.config.json capacitor.config.ts
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init AetherOS com.aether.os --web-dir dist
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
