
workflows:
  android-workflow:
    name: AetherOS Android Build
    max_build_duration: 30
    environment:
      node: v20
      java: 17
    scripts:
      - name: Extract and Build Web
        script: |
          unzip -q app-store-mirror-main.zip
          cd app-store-mirror-main
          npm install
          npm run build
      - name: Clean Setup and Build APK
        script: |
          cd app-store-mirror-main
          # Eski android ve config kalıntılarını temizle
          rm -rf android capacitor.config.json capacitor.config.ts
          
          # Paketleri kur
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor'ü doğru dist klasörüyle başlat
          npx cap init AetherOS com.aether.os --web-dir dist
          
          # Web dosyalarının kopyalanması için önce klasörü oluştur ve index.html kopyala (güvenceye alalım)
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/ || true
          
          npx cap add android
          npx cap copy android
          
          # Gradle derlemesini çalıştır
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app-store-mirror-main/android/app/build/outputs/apk/debug/*.apk
