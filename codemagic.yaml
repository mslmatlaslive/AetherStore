workflows:
  android-workflow:
    name: AetherOS Android Build
    max_build_duration: 30
    environment:
      node: v20
      java: 17
    scripts:
      - name: Extract and Build Web
        script: |
          unzip -q app-store-mirror-main.zip
          cd app-store-mirror-main
          npm install
          npm run build
      - name: Clean Setup and Build APK
        script: |
          cd app-store-mirror-main
          
          # Her şeyi tertemiz yap
          rm -rf android capacitor.config.json capacitor.config.ts
          
          # Paketleri kur
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor'ü başlat
          npx cap init AetherOS com.aether.os --web-dir dist
          
          # Android platformunu sıfırdan ekle
          npx cap add android
          
          # Web dosyalarını android içine kopyala (dist klasörünü kontrol ederek)
          if [ -d "dist" ]; then
            npx cap copy android
          elif [ -d "build" ]; then
            mv build dist
            npx cap copy android
          else
            echo "Web build klasörü bulunamadı!"
            exit 1
          fi
          
          # Gradle derlemesi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app-store-mirror-main/android/app/build/outputs/apk/debug/*.apk
